name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install runtime and test dependencies
        run: python -m pip install -e './python[test]'
      - name: Run Python runtime, schema, and fixture tests
        run: python -m pytest python/tests -q

  swift:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift package and boundary tests
        run: swift test

  security-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -e './python[test]'
      - name: Validate closed schemas and replay fixtures
        run: >-
          python -m pytest
          python/tests/test_schemas.py
          python/tests/test_conformance_replay.py
          python/tests/test_agent_recovery.py
          python/tests/test_knowledge.py
          -q
